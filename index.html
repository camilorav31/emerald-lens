<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f382a" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Emulador de GBA en el navegador (mGBA en WebAssembly) que lee la memoria del juego en vivo. Tu cartucho nunca sale de tu navegador."
    />
    <title>Emerald Lens</title>
    <script>
      // Apply the saved or system theme before first paint (same rule as useResolvedTheme)
      try {
        const saved = JSON.parse(localStorage.getItem('emerald-lens:settings') || '{}').state?.theme
        const theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = theme
        // Same literals as THEME_COLOR in ThemeToggle.tsx (the CSS is not loaded yet, so they cannot be read from it)
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#dcede4' : '#0f382a')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
